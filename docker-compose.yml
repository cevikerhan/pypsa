html, body, #root {
  margin: 0;
  min-height: 100%;
  background: #091421;
  font-family: Inter, system-ui, sans-serif;
}

body {
  min-height: 100vh;
}

* {
  box-sizing: border-box;
}

button {
  transition: all 0.2s ease;
}

::-webkit-scrollbar {
  width: 10px;
}

::-webkit-scrollbar-thumb {
  background: rgba(125, 211, 252, 0.2);
  border-radius: 8px;
}
